<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 22" width="46mm" height="22mm" font-family="Helvetica, Arial, sans-serif">
<title>Power hat (fused Powerpole tap)</title>
<desc>Drawn for FRC Team 5090 TorqueNados in the style of the FRC 2102 Paradox icon collection. A Powerpole tap on a motor's power run with a built-in fuse, feeding that mechanism's sensors. CC0 1.0.</desc>
<rect x="0" y="0" width="46" height="22" rx="2" fill="#c9d1d9" stroke="#8c959f" stroke-width="0.5"/>
<rect x="1.4" y="1.4" width="43.2" height="19.2" rx="1.2" fill="#16191d"/>
<rect x="2.5" y="6" width="5" height="10" rx="0.6" fill="#cf222e"/><rect x="38.5" y="6" width="5" height="10" rx="0.6" fill="#cf222e"/>
<rect x="19" y="13.5" width="8" height="5" rx="0.6" fill="#e3b341" stroke="#9a6700" stroke-width="0.3"/>
<text x="23" y="17.2" font-size="2.6" fill="#16191d" text-anchor="middle" font-weight="bold">FUSE</text>
<text x="23" y="9" font-size="3.6" fill="#f0f3f6" text-anchor="middle" font-weight="bold">POWER HAT</text>
<text x="5" y="20" font-size="2.2" fill="#c9d1d9" text-anchor="middle">IN</text><text x="41" y="20" font-size="2.2" fill="#c9d1d9" text-anchor="middle">OUT</text>
</svg>
